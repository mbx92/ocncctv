services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-ocn-files}
      SUPPLIER_CATALOG_SPREADSHEET_ID: ${SUPPLIER_CATALOG_SPREADSHEET_ID:-}
      SUPPLIER_CATALOG_SUPPLIER_NAME: ${SUPPLIER_CATALOG_SUPPLIER_NAME:-}
      ERP_SYNC_BASE_URL: ${ERP_SYNC_BASE_URL:-}
      ERP_SYNC_API_KEY: ${ERP_SYNC_API_KEY:-}
    ports:
      - "3018:3000"
    networks:
      - default
      - coolify
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

networks:
  coolify:
    external: true
